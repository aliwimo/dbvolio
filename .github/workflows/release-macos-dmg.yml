# Builds macOS .dmg installers only and attaches them to a GitHub Release.
#
# Triggers:
#   - Run manually from Actions → release-macos-dmg
#   - Push a version tag (e.g. v0.1.0) — uploads to the same release as release.yml
name: release-macos-dmg

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish-dmg:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - args: '--target aarch64-apple-darwin --bundles dmg'
            label: Apple Silicon
          - args: '--target x86_64-apple-darwin --bundles dmg'
            label: Intel

    runs-on: macos-latest
    name: DMG (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DB-Volio v__VERSION__'
          releaseBody: |
            macOS **.dmg** installers for DB-Volio (local-first DBML editor).

            | Architecture | File |
            | --- | --- |
            | Apple Silicon (M1+) | `*_aarch64.dmg` |
            | Intel | `*_x64.dmg` or `*_x86_64.dmg` |

            See [README](https://github.com/aliwimo/dbvolio#readme) for features and shortcuts.
          generateReleaseNotes: true
          prerelease: true
          args: ${{ matrix.args }}
