# macOS Apple Silicon (M1+) .dmg release only.
#
# Triggers:
#   - Actions → release → Run workflow
#   - Push tag v* (after bumping version in package.json, tauri.conf.json, Cargo.toml)
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-macos-dmg:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DB-Volio v__VERSION__'
          releaseBody: |
            macOS **Apple Silicon (M1+)** `.dmg` for DB-Volio — local-first DBML editor with a live ER diagram.

            See [README](https://github.com/aliwimo/dbvolio#readme) for features and keyboard shortcuts.

            **Early preview** — APIs and packaging may change.
          generateReleaseNotes: true
          prerelease: true
          # Native arm64 on macos-latest; DMG only (no Intel / Linux / Windows).
          args: '--bundles dmg'
