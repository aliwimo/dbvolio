# Builds DB-Volio for macOS, Linux, and Windows and publishes a GitHub Release.
#
# Triggers:
#   - Push a version tag (e.g. v0.1.0) after bumping package.json / tauri.conf.json / Cargo.toml
#   - Run manually from Actions → release → Run workflow (uses app version from tauri.conf.json)
name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DB-Volio v__VERSION__'
          releaseBody: |
            Local-first DBML editor with a live ER diagram. See [README](https://github.com/aliwimo/dbvolio#readme) for features and keyboard shortcuts.

            **Early preview** — APIs and packaging may change.
          generateReleaseNotes: true
          prerelease: true
          args: ${{ matrix.args }}
