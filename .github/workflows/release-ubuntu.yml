# Ubuntu .deb + AppImage → GitHub Release (tag v__VERSION__).
name: release-ubuntu

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-ubuntu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Ubuntu (.deb, AppImage)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DB-Volio v__VERSION__'
          releaseBody: |
            **Linux (Ubuntu 22.04):** `.deb` and AppImage.

            Local-first DBML editor — see [README](https://github.com/aliwimo/dbvolio#readme).
          generateReleaseNotes: true
          prerelease: true
          args: '--bundles deb,appimage'
