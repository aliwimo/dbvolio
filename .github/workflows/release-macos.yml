# macOS Apple Silicon (M1+) .dmg → GitHub Release (tag v__VERSION__).
name: release-macos

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: macOS DMG (Apple Silicon)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'DB-Volio v__VERSION__'
          releaseBody: |
            **macOS (Apple Silicon, M1+):** `.dmg` installer.

            Local-first DBML editor — see [README](https://github.com/aliwimo/dbvolio#readme).
          generateReleaseNotes: true
          prerelease: true
          args: '--bundles dmg'
